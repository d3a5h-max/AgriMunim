# Builds the Windows installer, the Android APK and the web app on GitHub's computers.
# Push to GitHub, open the Actions tab, pick the latest run, and download the files under "Artifacts".
name: Build AgriMunim

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --version && npm --version
      - run: npm install --no-audit --no-fund
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: AgriMunim-Windows-installer
          path: release/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - name: Create the Android project if it is not in the repo
        run: |
          if [ ! -d android ]; then npm run android:init; fi
      - run: npm run build:android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AgriMunim-Android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: AgriMunim-web-app
          path: dist
          if-no-files-found: error
